[project]
name = "wicketgate-publish"
version = "0.1.0"
description = "A small static site publisher for Wicketgate Systems."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "pyyaml>=6.0",
]

[project.scripts]
wicketgate-publish = "wicketgate_publish.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wicketgate_publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
